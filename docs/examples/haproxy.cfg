# Replace the hostnames and certificate paths with those of one Gantry quorum.
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout check 6s
    retries 0

frontend gantry_api
    bind :443 ssl crt /etc/haproxy/tls/gantry-api.pem
    default_backend gantry_controllers

backend gantry_controllers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host gantry.example
    http-check expect status 200
    default-server inter 5s fall 2 rise 2
    server controller-a controller-a.example:443 check ssl verify required ca-file /etc/haproxy/tls/controller-ca.pem verifyhost controller-a.example sni str(controller-a.example) check-sni controller-a.example
    server controller-b controller-b.example:443 check ssl verify required ca-file /etc/haproxy/tls/controller-ca.pem verifyhost controller-b.example sni str(controller-b.example) check-sni controller-b.example
    server controller-c controller-c.example:443 check ssl verify required ca-file /etc/haproxy/tls/controller-ca.pem verifyhost controller-c.example sni str(controller-c.example) check-sni controller-c.example
