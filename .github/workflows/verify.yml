name: Verify Gantry
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.0.5'
          gleam-version: '1.19.0'
          rebar3-version: '3.27.0'
          version-type: strict
      - run: make check
      - run: scripts/queue-dst.sh guided 1 64
      - name: Check generated worker journal bindings
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes sqlite3
          fi
          make gen-sql
          git diff --exit-code -- packages/server/src/gantry/sql.gleam
      - name: Check the queue model
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          make model-check TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar"
      - name: Install the bundled release
        run: make install PREFIX="$RUNNER_TEMP/gantry"
      - name: Verify the installed controller and worker
        run: GANTRY_RELEASE_BIN="$RUNNER_TEMP/gantry/bin" make e2e
